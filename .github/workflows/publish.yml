name: Publish

# This SDK is distributed through Swift Package Manager, which resolves
# packages directly from this repository's git tags. There is no package
# registry to push to: cutting a GitHub release (which creates the tag) is
# the publish step. This workflow validates that the tagged commit builds
# cleanly so consumers can depend on the release with confidence.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Swift package builds
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Tag the release version
        # Swift Package Manager resolves versions from git tags, so creating the
        # tag is what actually publishes this release. Version comes from the
        # CHANGELOG (SwiftPM has no manifest version field). Idempotent: on a
        # release-triggered run the tag already exists and this is a no-op.
        run: |
          VERSION="$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version from CHANGELOG.md"
            exit 1
          fi
          TAG="v$VERSION"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "Tag $TAG already exists — nothing to publish."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Published $TAG — SwiftPM consumers can now resolve this version."
          fi
